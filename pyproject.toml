[project]
name = "tennis-clips"
version = "0.3.0"
description = "Detecta batidas de tênis e cria automaticamente um vídeo com os melhores cortes."
readme = "README.md"
authors = [
    { name = "Matheus Monteiro", email = "monteiromatheus.rocha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mediapipe==0.10.21",
    "numpy>=1.26.4,<2",
    "opencv-contrib-python==4.11.0.86",
    "scipy>=1.14,<2",
]

[project.scripts]
tennis-clips = "tennis_clips:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
