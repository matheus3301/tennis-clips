[project]
name = "tennis-clips"
version = "0.2.0"
description = "Detecta batidas de tênis e cria automaticamente um vídeo com os melhores cortes."
readme = "README.md"
authors = [
    { name = "Matheus Monteiro", email = "monteiromatheus.rocha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "scipy>=1.18.0",
]

[project.scripts]
tennis-clips = "tennis_clips:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
