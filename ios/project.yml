name: tennis-clips
options:
  minimumXcodeGenVersion: 2.46.0
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
packages:
  TennisClipsCore:
    path: core
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.6.1
targets:
  TennisClips:
    type: application
    platform: iOS
    sources:
      - path: app
      - path: shared
    dependencies:
      - package: TennisClipsCore
      - package: Lottie
      - target: TennisClipsActivity
        embed: true
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: Tennis Clips
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: Selecione as gravações do seu jogo ou treino.
        NSPhotoLibraryAddUsageDescription: Salve jogadas e compilações na sua biblioteca.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - dev.mmonteiro.tennisclips.processing.*
        CFBundleURLTypes:
          - CFBundleURLName: dev.mmonteiro.tennisclips.session
            CFBundleURLSchemes:
              - tennisclips
        UIBackgroundModes:
          - processing
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        PRODUCT_BUNDLE_IDENTIFIER: dev.mmonteiro.tennisclips
        PRODUCT_NAME: TennisClips
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  TennisClipsActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: live-activity
      - path: shared
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: live-activity/Info.plist
      properties:
        CFBundleDisplayName: Tennis Clips
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        PRODUCT_BUNDLE_IDENTIFIER: dev.mmonteiro.tennisclips.activity
        PRODUCT_NAME: TennisClipsActivity
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  TennisClipsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: TennisClips
      - package: TennisClipsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mmonteiro.tennisclips.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TennisClips:
    build:
      targets:
        TennisClips: all
        TennisClipsTests: [test]
    test:
      targets:
        - TennisClipsTests
