name: tennis-clips
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
packages:
  TennisClipsCore:
    path: core
targets:
  TennisClips:
    type: application
    platform: iOS
    sources:
      - path: app
    dependencies:
      - package: TennisClipsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matheus3301.tennisclips
        PRODUCT_NAME: TennisClips
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tennis Clips
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Selecione uma gravação de treino para processar no próprio iPhone.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Salve a compilação das jogadas na sua biblioteca.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
  TennisClipsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: TennisClips
      - package: TennisClipsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matheus3301.tennisclips.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TennisClips:
    build:
      targets:
        TennisClips: all
        TennisClipsTests: [test]
    test:
      targets:
        - TennisClipsTests
